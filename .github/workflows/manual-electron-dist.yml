name: Manual Electron Dist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Electron dist
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Use declared npm
        run: node scripts/ensure-package-manager.mjs

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron dependencies
        run: npm ci --no-audit --no-fund
        working-directory: electron

      - name: Build Electron dist
        run: npm run electron:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Electron dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
